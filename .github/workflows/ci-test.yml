name: Unit tests
on: 
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
    linting:
      name: static-code-analysis
      runs-on: ["ubuntu-latest"]
      steps:
        - name: install uv
          uses: astral-sh/setup-uv@v7
          with:
            enable-cache: true
        - name: Checkout latest version from GIT
          uses: actions/checkout@v1
        - name: Install linting dependency
          run: uv sync --only-group lint
        - name: Run Ruff
          run: uv run ruff check . --show-fixes
    run-tests:
      name: Running Unit-tests ${{matrix.os}} Python(${{matrix.python-version}})
      runs-on: ${{matrix.os}}
      strategy:
        fail-fast: false
        matrix:
          os: [ubuntu-latest, macos-latest, windows-latest]
          python-version: ["3.12", "3.13", "3.14"]
      steps:
        - name: install uv
          uses: astral-sh/setup-uv@v7
          with:
            enable-cache: true
        - name: install python ${{matrix.python-version}}
          run: uv python install ${{matrix.python-version}}
        - name: Checkout latest version from GIT
          uses: actions/checkout@v1
        - name: Install test dependency
          run: uv sync --only-group test
        - name: Run tests
          run: uv run pytest -vs